{% load static %}
<!DOCTYPE html>
<html lang="da-DK">
<head>
<title>{% block title %}TREOENs STREGSYSTEM{% endblock %}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="{% static 'productdle/stregsystem.css' %}">
<link rel="stylesheet" media="(hover: hover) and (pointer: fine)" href="{% static 'productdle/cursor.css' %}">
{% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="left">
    <input type="button" id="restartBtn" onclick="location.href='{{ stregsystem_url }}';" value="Genstart" accesskey="q">
  </div>
  <h1>
    {% block heading %}TREOENs STREGSYSTEM{% endblock %}
  </h1>
  <div class="right">
    <input type="button" onclick="location.href='{{ stregsystem_url }}';" value="Menu"/>
    {% block signup_button %}{% endblock %}
  </div>
</header>
<div id="base-content">
{% block content %}{% endblock %}
</div>
<footer>
  <ul id="footer-notes">
    <li>Skabt af Fklubben</li>
    <li><button type="button" onclick="location.href='https://fklub.dk/tos';">Terms of Service</button></li>
    {% if source_url %}<li><button type="button" onclick="location.href='{{ source_url }}';">Se koden</button></li>{% endif %}
  </ul>
</footer>
</body>
</html>
