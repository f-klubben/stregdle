name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # what production runs
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install '.[prod]' black
      - name: Test
        run: python manage.py test
      - name: Formatting
        run: black --check .
