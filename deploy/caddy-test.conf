# Appended to /srv/infra/caddy/Caddyfile by deploy/test-site.sh. Kept here so
# the test site can be rebuilt from this repository.
test.stregdle.fklub.dk {
	# `site` is the club's shared snippet: compression and access logging.
	import site

	handle_path /static/* {
		root * /data/stregdle-test/staticfiles
		file_server
	}

	handle {
		reverse_proxy 127.0.0.1:8002
	}
}
