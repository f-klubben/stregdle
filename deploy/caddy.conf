# nginx was the original plan; the F-klub server runs Caddy, and this is the
# block in /srv/infra/caddy/Caddyfile that serves the game. It is kept here so
# the deployment can be rebuilt from this repository.
#
# Caddy terminates TLS and serves collectstatic's output; gunicorn answers on
# the loopback port. Reload with:
#   caddy validate --config /srv/infra/caddy/Caddyfile --adapter caddyfile
#   caddy reload --config /srv/infra/caddy/Caddyfile --adapter caddyfile

stregdle.fklub.dk {
	# `site` is the club's shared snippet: compression and access logging.
	import site

	handle_path /static/* {
		root * /data/stregdle/staticfiles
		file_server
	}

	handle {
		reverse_proxy 127.0.0.1:8001
	}
}
