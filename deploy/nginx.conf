# nginx site for Stregsystemdle: gunicorn serves the app, nginx serves the files
# and terminates TLS. Drop into /etc/nginx/sites-available/stregdle and link it
# into sites-enabled. Certificates are managed elsewhere on the server.

server {
    listen 80;
    server_name stregdle.fklub.dk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stregdle.fklub.dk;

    # ssl_certificate     /etc/letsencrypt/live/stregdle.fklub.dk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stregdle.fklub.dk/privkey.pem;

    client_max_body_size 1m;

    location /static/ {
        alias /data/stregdle/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
